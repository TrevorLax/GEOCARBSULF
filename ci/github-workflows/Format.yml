name: Format
on: [pull_request]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - run: julia -e 'using Pkg; Pkg.add("JuliaFormatter"); using JuliaFormatter; format("."; verbose = true) || (println("run JuliaFormatter.format(\".\")"); exit(1))'
        continue-on-error: true
