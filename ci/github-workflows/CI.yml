name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        threads: ["1"]
        include:
          - version: "1"
            os: ubuntu-latest
            threads: "4"
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
        continue-on-error: true
  legacy:
    name: Comparison with the original R/Fortran code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: r-lib/actions/setup-r@v2
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: Rscript -e 'install.packages(c("lhs", "CholWishart", "abind"), repos = "https://cloud.r-project.org")'
      - uses: julia-actions/julia-buildpkg@v1
      - run: julia --project=. test/legacy_comparison/run_comparison.jl
