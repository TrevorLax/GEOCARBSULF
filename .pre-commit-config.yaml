# Git hooks, run with prek (https://github.com/j178/prek); plain pre-commit reads the
# same file. Set up once per clone:
#
#   prek install                      # installs the pre-commit and pre-push hooks
#   then run every hook once on all files, skipping the legacy/ guard:
#     cmd:        set "SKIP=legacy-untouched" & prek run --all-files & set "SKIP="
#     PowerShell: $env:SKIP="legacy-untouched"; prek run --all-files; Remove-Item Env:SKIP
#     bash/zsh:   SKIP=legacy-untouched prek run --all-files
#   (SKIP=hook-id command is bash syntax; in cmd and PowerShell always clear SKIP again.)
#
# pre-commit stage: file hygiene, workflow linting, JuliaFormatter, legacy/ guard.
# pre-push stage:   CHANGELOG/AI-usage check, golden regression tests, the live
#                   comparison with the original R/Fortran code (every push), the
#                   notebook-tour page stamp when the tour changed, and the
#                   documentation build when docs or docstrings may have changed.
#
# Hooks are a convenience: `git push --no-verify` skips them. The required checks on
# `main` are the guarantee (see CI_CD_PLAN.md). Keep this file free of prek-only
# features (no `repo: builtin`), so pre-commit can run it too.
#
# Hook repositories are pinned to full commit SHAs; update with `prek auto-update`
# and review the result like any other change.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: true

# Golden data and generated output: never touched by any hook. docs/src/generated/ is
# the executed notebook-tour page (notebooks/build.jl --docs-page); notebooks/build.jl
# warns about figures above the 1000 KB large-file limit itself.
exclude: ^(data/|test/fixtures/fortran/|test/legacy_comparison/output/|docs/build/|docs/src/generated/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # legacy/ holds the original R/Fortran code and must stay byte-identical.
      # The pre-commit-hooks manifest gives trailing-whitespace, end-of-file-fixer and
      # check-added-large-files the pre-push stage too, which overrides default_stages;
      # `stages: [pre-commit]` keeps them to commits.
      - id: trailing-whitespace
        exclude: ^legacy/
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: ^legacy/
        stages: [pre-commit]
      - id: mixed-line-ending
        exclude: ^legacy/|\.bat$ # batch files are CRLF (.gitattributes)
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]
      - id: detect-private-key

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # v1.32.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # ---- pre-commit stage -----------------------------------------------------
      - id: juliaformatter
        name: JuliaFormatter (BlueStyle, version pinned in tools/format)
        language: system
        entry: julia --startup-file=no --project=tools/format scripts/dev/format.jl
        types: [julia]

      - id: legacy-untouched
        name: legacy/ stays unmodified (to override, skip the hook legacy-untouched)
        language: fail
        entry: >-
          legacy/ holds the original R/Fortran code and must stay unmodified. If the
          change is intended, name legacy/ in the CHANGELOG entry and commit with this
          hook skipped. cmd: set "SKIP=legacy-untouched" & git commit & set "SKIP=" --
          PowerShell: $env:SKIP="legacy-untouched"; git commit; Remove-Item Env:SKIP --
          bash: SKIP=legacy-untouched git commit
        files: ^legacy/

      # ---- pre-push stage -------------------------------------------------------
      - id: changelog-ai
        name: CHANGELOG entry and AI usage (scripts/ci/check_changes.jl)
        language: system
        entry: julia --startup-file=no scripts/ci/check_changes.jl
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: golden-regression
        name: golden-master tests against the compiled Fortran
        language: system
        entry: julia --startup-file=no --project=. scripts/dev/test_group.jl regression
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: legacy-comparison
        name: live comparison with the original R/Fortran code (needs R)
        language: system
        entry: julia --startup-file=no --project=. test/legacy_comparison/run_comparison.jl --no-plots
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: tour-page-stamp
        name: notebook-tour page up to date with tour.jl (notebooks/tour_stamp.jl)
        language: system
        entry: julia --startup-file=no notebooks/tour_stamp.jl
        stages: [pre-push]
        pass_filenames: false
        files: ^(notebooks/tour\.jl|notebooks/tour_helpers\.jl|notebooks/tour_stamp\.jl|docs/src/generated/)

      - id: docs-build
        name: documentation build with doctests
        language: system
        entry: julia --startup-file=no --project=docs scripts/dev/docs.jl
        stages: [pre-push]
        pass_filenames: false
        files: ^(docs/src/|docs/make\.jl|src/|AI_USAGE\.md|README\.md)
