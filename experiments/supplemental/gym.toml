# Supplemental experiment "gym" (lhs_driver_supp.R): R parameters
# supp_experiment_parameters = c(beg, end, gym_fac, dT2X_fac) map to the [model] table.
# Only the CO2 + temperature experiment at 50 % outbound was run.
#
# Seed: the supplemental experiments share the seed and the sampling settings of their
# control, the main ct_out50 experiment (grid index 15 in experiments/main/grid.toml,
# seed 1234 * 15 = 18510). Every chunk then draws the same constant parameters and
# forcing series as the control, so the comparison is paired and differences come from
# the model options alone. The R code used 1234 * 3 = 3702; Julia's random streams
# differ from R's in any case. test/workflow/test_config.jl checks the pairing.

name        = "supplemental_gym"
description = "Supplemental experiment: gym"
tag_suffix  = "gym"
constraint  = "both"
threshold   = 0.5
seed        = 18510   # = the control (main ct_out50)
n_sample     = 20_000_000
n_per_chunk  = 10_000
n_accept_min = 10_000
output_dir   = "results/supplemental"

[model]
gym_angio_transition = [130, 80]
gym_factor           = 0.25
dT2X_ramp            = false
