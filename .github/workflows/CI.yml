# Test suite on Linux, macOS and Windows. The default test groups include `regression`,
# which checks the model against golden-master output of the original Fortran
# (test/fixtures/fortran), so every cell of the matrix verifies the port without R.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} · ${{ matrix.os }} · ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write # julia-actions/cache prunes its superseded caches
      contents: read
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"] # 1.10 = LTS and the [compat] floor
        os: [ubuntu-latest, macos-latest, windows-latest]
        threads: ["1"]
        include:
          # results must not depend on the number of threads
          - { version: "1", os: ubuntu-latest, threads: "4" }
          # early warning for the next Julia release (allowed to fail)
          - { version: "pre", os: ubuntu-latest, threads: "1" }
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
      - name: Process coverage
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest' && matrix.threads == '1'
        uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
      - name: Upload coverage to Codecov
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest' && matrix.threads == '1'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Single, stable status for branch protection ("CI result"), whatever the matrix.
  result:
    name: CI result
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the test matrix
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix: $RESULT"
          [ "$RESULT" = "success" ]
