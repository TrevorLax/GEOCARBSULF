# Build the JOSS paper draft (paper/paper.md + paper.bib) with the Open Journals
# toolchain and upload the PDF. Download it from the run's "paper" artifact.
name: Paper

on:
  push:
    branches: ["**"]
    paths: ["paper/**", "AI_USAGE.md", ".github/workflows/Paper.yml"]
  pull_request:
    paths: ["paper/**", "AI_USAGE.md", ".github/workflows/Paper.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    name: JOSS paper draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@af22ceb4b8f9eff6b3a13c05747ccc2f573cf2e6 # master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload the PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper
          path: paper/paper.pdf
          retention-days: 30
