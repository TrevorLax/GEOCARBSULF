# BlueStyle formatting check (.JuliaFormatter.toml) with the JuliaFormatter version
# pinned in tools/format, the same environment the pre-commit hook uses. Fix locally:
#   prek run juliaformatter --all-files
# or
#   julia --project=tools/format -e 'using Pkg; Pkg.instantiate(); using JuliaFormatter; format(".")'
name: Format

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"
      - name: Install the pinned JuliaFormatter (tools/format)
        run: julia --project=tools/format -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
      - name: Check formatting
        run: |
          julia --project=tools/format -e '
            using JuliaFormatter
            if !format("."; overwrite = false)
                println("::error::Files are not BlueStyle-formatted. Run: prek run juliaformatter --all-files")
                exit(1)
            end'
