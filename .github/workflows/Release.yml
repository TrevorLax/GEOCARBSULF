# Pushing a tag vX.Y.Z publishes a GitHub Release. Zenodo's GitHub integration (switch
# it on once at https://zenodo.org/account/settings/github/) archives every published
# release and mints a DOI, which JOSS requires at acceptance.
#
#  1. `check`: tag vs Project.toml / CITATION.cff / CHANGELOG.md, no placeholders left
#     (fast, so a bad tag fails before the long notebook run);
#  2. `notebook`: PublishNotebook.yml runs the notebook tour in full at the tag
#     (15-60 min); if it fails, no release is made;
#  3. `release`: creates the release as a DRAFT with the executed .ipynb and .html
#     attached, then publishes it. Zenodo archives on publication, so it never sees a
#     release without its notebook. If publishing fails after the draft was made, publish
#     the draft by hand (Releases page) rather than re-running: re-running fails because
#     the release already exists.
#
# Release checklist: bump `version` in Project.toml and CITATION.cff, add a
# "## X.Y.Z" section to CHANGELOG.md, resolve all TODOs in AI_USAGE.md and
# paper/paper.md, merge to main, then:  git tag vX.Y.Z && git push origin vX.Y.Z
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          pv=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Project.toml)
          cv=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' CITATION.cff)
          fail=0
          [ "$v" = "$pv" ] || { echo "::error file=Project.toml::tag $TAG but Project.toml version is $pv"; fail=1; }
          [ "$v" = "$cv" ] || { echo "::error file=CITATION.cff::tag $TAG but CITATION.cff version is $cv"; fail=1; }
          grep -qE "^## +v?${v//./\\.}( |$)" CHANGELOG.md || { echo "::error file=CHANGELOG.md::no '## $v' section in CHANGELOG.md"; fail=1; }
          if grep -qiE "^## +v?${v//./\\.} .*unreleased" CHANGELOG.md; then echo "::error file=CHANGELOG.md::section $v is still marked unreleased"; fail=1; fi
          if grep -n 'TODO' AI_USAGE.md paper/paper.md paper/paper.bib CITATION.cff; then echo "::error::TODO placeholders left in the AI usage report, paper or citation metadata"; fail=1; fi
          if grep -rn 'PORT_AUTHOR\|OWNER/GeocarbPrecalibration' --include='*.md' --include='*.toml' --include='*.cff' --include='*.yml' --include='*.bib' . | grep -v '^./.github/workflows/'; then
            echo "::error::author/owner placeholders are left (see above)"; fail=1
          fi
          exit $fail

  notebook:
    name: Notebook
    needs: check
    # A ceiling for the called workflow, not a grant: its `run` job asks only for
    # actions: write (cache pruning) and contents: read; its manual-only `attach` job,
    # skipped here, declares contents: write, which must not exceed this ceiling.
    permissions:
      actions: write
      contents: write
    # ./ rather than zizmor's `$/...` self-repository syntax: actionlint 1.7.12 does not
    # know the new form (as in Weekly.yml).
    uses: ./.github/workflows/PublishNotebook.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ github.ref_name }}

  release:
    name: GitHub Release
    needs: notebook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create and publish the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '
            $0 ~ "^## +v?" v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > release_notes.md
          cat release_notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.notebook.outputs.artifact }}
          path: ${{ runner.temp }}/notebook
      - name: Create the release as a draft with the notebook attached, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NB: ${{ runner.temp }}/notebook
        run: |
          ls -l "$NB"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "GeocarbPrecalibration.jl $TAG" --notes-file release_notes.md \
            "$NB/GeocarbPrecalibration_tour.html" "$NB/GeocarbPrecalibration_tour.ipynb"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq '"draft: \(.isDraft); assets: \([.assets[].name] | join(", "))"'
